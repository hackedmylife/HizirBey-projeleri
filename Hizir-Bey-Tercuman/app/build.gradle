plugins { id 'com.android.application' }

android {
    namespace 'com.hizirbey.tercuman'
    compileSdk 35
    defaultConfig {
        applicationId 'com.hizirbey.tercuman'
        minSdk 26
        targetSdk 34
        versionCode 8
        versionName '0.5.0'
        ndk { abiFilters(*(project.hasProperty('testAbi') ? [project.property('testAbi')] : ['arm64-v8a','armeabi-v7a'])) }
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        externalNativeBuild { cmake { cFlags '-O3'; cppFlags '-std=c++17 -O3'; arguments '-DANDROID_STL=c++_static' } }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        debug {
            storeFile rootProject.file('signing/hizirbey-test.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    testOptions { unitTests.includeAndroidResources = true }
    lint { abortOnError true; checkReleaseBuilds true }
    ndkVersion '25.2.9519653'
    externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' } }
    androidResources { noCompress += ['bin','traineddata'] }
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'com.google.mlkit:translate:17.0.3'
    implementation 'com.google.mlkit:language-id:17.0.6'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
    implementation 'com.google.mlkit:text-recognition-japanese:16.0.1'
    implementation 'com.google.mlkit:text-recognition-korean:16.0.1'
    implementation 'com.google.mlkit:text-recognition-devanagari:16.0.1'
    implementation 'cz.adaptech.tesseract4android:tesseract4android:4.8.0'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
