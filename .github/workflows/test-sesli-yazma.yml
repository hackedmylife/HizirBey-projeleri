name: Sesli Yazma QA
on:
  push:
    paths:
      - 'sesli-yazma/**'
      - '.github/workflows/test-sesli-yazma.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: sesli-yazma
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sesli-yazma/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - name: Browser UI and editor checks
        run: node tests/browser.mjs
      - name: Prepare deterministic local microphone input
        run: |
          python3 - <<'PY'
          import wave
          with wave.open('tests/fixtures/speech-16k.wav','rb') as source:
              assert source.getframerate()==16000 and source.getnchannels()==1 and source.getsampwidth()==2
              samples=source.readframes(source.getnframes())
          with wave.open('/tmp/hizir-qa-voice.wav','wb') as f:
              f.setparams((1,2,16000,0,'NONE','not compressed'))
              # A public speech excerpt replaces the old pure tone, which the
              # new speech gate intentionally rejects. No user audio is used.
              f.writeframes(b'\0'*(16000*2)+samples[16000:80000]+b'\0'*(16000*57*2))
          PY
      - name: MV3 microphone and mocked API checks
        shell: bash
        env:
          TEST_AUDIO: /tmp/hizir-qa-voice.wav
        run: node tests/extension.mjs 2>&1 | tee .qa/mv3.log
      - name: QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sesli-yazma-qa
          path: sesli-yazma/.qa/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
