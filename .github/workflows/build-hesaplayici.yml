name: Build Hesaplayici Windows EXE

on:
  push:
    branches: [main]
    paths:
      - 'hesaplayici/**'
      - '.github/workflows/build-hesaplayici.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-exe:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build standalone executable
        run: python hesaplayici/build_exe.py
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: HizirBey-Hesaplayici-Windows
          path: hesaplayici/dist/HizirBey_Hesaplayici.exe
          if-no-files-found: error
          retention-days: 90
