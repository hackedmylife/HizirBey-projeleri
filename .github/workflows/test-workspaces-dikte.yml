name: WorkSpaces Dikte Windows checks
on:
  push:
    paths:
      - 'workspaces-dikte/**'
      - '.github/workflows/test-workspaces-dikte.yml'
  pull_request:
    paths:
      - 'workspaces-dikte/**'
      - '.github/workflows/test-workspaces-dikte.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify portable runtime and package
        shell: pwsh
        run: python workspaces-dikte/scripts/package.py --check
      - name: Native clipboard, focus, draft preservation and layout tests
        shell: pwsh
        run: |
          $runtime = Resolve-Path workspaces-dikte/vendor/AutoHotkey64.exe
          $script = Resolve-Path workspaces-dikte/tests/windows-tests.ahk
          $result = Join-Path $env:RUNNER_TEMP 'workspaces-tests.txt'
          $p = Start-Process -FilePath $runtime -ArgumentList @('/ErrorStdOut', ('"' + $script + '"'), ('"' + $result + '"')) -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP/ahk-stdout.txt" -RedirectStandardError "$env:RUNNER_TEMP/ahk-stderr.txt"
          if (-not $p.WaitForExit(45000)) { $p.Kill(); throw 'AHK tests timed out' }
          Get-Content "$env:RUNNER_TEMP/ahk-stdout.txt", "$env:RUNNER_TEMP/ahk-stderr.txt" -ErrorAction SilentlyContinue
          if (Test-Path $result) { Get-Content $result }
          if ($p.ExitCode -ne 0 -or -not (Test-Path $result)) { throw 'AHK tests failed' }
      - name: Check actual entry script starts and exits
        shell: pwsh
        run: |
          $runtime = Resolve-Path workspaces-dikte/vendor/AutoHotkey64.exe
          $script = Resolve-Path workspaces-dikte/Hizir-Bey-WorkSpaces-Dikte.ahk
          $p = Start-Process -FilePath $runtime -ArgumentList @('/ErrorStdOut', ('"' + $script + '"'), '--smoke') -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP/smoke-stdout.txt" -RedirectStandardError "$env:RUNNER_TEMP/smoke-stderr.txt"
          if (-not $p.WaitForExit(10000)) { $p.Kill(); throw 'Entry smoke test timed out' }
          Get-Content "$env:RUNNER_TEMP/smoke-stdout.txt", "$env:RUNNER_TEMP/smoke-stderr.txt" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw 'Entry smoke test failed' }
      - name: Chromium LiveChat adapter and no-send checks
        shell: pwsh
        run: |
          $dependencies = Join-Path $env:RUNNER_TEMP 'hizir-bridge-test'
          npm install --prefix $dependencies --no-audit --no-fund playwright@1.62.1
          if ($LASTEXITCODE -ne 0) { throw 'Browser test dependency setup failed' }
          $env:PLAYWRIGHT_MODULE = Join-Path $dependencies 'node_modules/playwright'
          $env:CHROMIUM_PATH = 'C:\Program Files\Google\Chrome\Application\chrome.exe'
          if (-not (Test-Path $env:CHROMIUM_PATH)) { throw 'Runner Chrome not found' }
          node workspaces-dikte/tests/bridge-browser.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Bridge browser checks failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WorkSpaces-Dikte-Windows-Test-Results
          path: |
            ${{ runner.temp }}/workspaces-tests.txt
            ${{ runner.temp }}/ahk-*.txt
            ${{ runner.temp }}/smoke-*.txt
